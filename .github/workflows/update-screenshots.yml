name: Update Screenshots

# As in OMICRONEnergyOSS/oscd-gh-workflows (update-screenshots.yml): when the
# screenshot tests fail on a branch, the baselines are made again in the
# Playwright container and committed to the branch, so that the change can
# be reviewed in its pull request. main is never changed this way.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: update-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-screenshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Screenshot tests
        id: tests
        run: npm run test:visual
        continue-on-error: true
        env:
          CI: true

      - name: Update and commit the screenshots
        if: ${{ steps.tests.outcome == 'failure' }}
        env:
          CI: true
        run: |
          npm run test:update
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "test: update screenshots"
          git push
